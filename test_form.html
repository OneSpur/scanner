<!DOCTYPE html>
<html>
<head>
    <title>Test Form Submission</title>
</head>
<body>

    <form method="POST" action="http://localhost:7433/analyze" id="test-form">
        <input type="text" name="repo_url" value="https://github.com/django/django" required>
        <input type="hidden" name="provider" value="claude-code">

        });
    </script>
