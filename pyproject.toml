[project]
name = "scanner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "requests",
    "httpx",
    "anthropic",
    "questionary",
    "rich",
    "itsdangerous",
    # Knowledge-graph pipeline
    "qdrant-client[fastembed]>=1.9.0",
    "networkx>=3.2",
]

[project.scripts]
1spur-scanner = "scanner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]
